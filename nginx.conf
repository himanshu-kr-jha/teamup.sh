events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Buffer sizes
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml;

    # Upstream
    upstream teamup_backend {
        server teamup:8080;
        keepalive 32;
    }

    # LiveKit's signalling socket. A page served over HTTPS cannot open a
    # ws:// connection to port 7880, so it is reached through this origin and
    # inherits the site's certificate.
    upstream teamup_livekit {
        server livekit:7880;
    }

    # Object storage. Uploads and inline images are presigned URLs the BROWSER
    # opens directly, so MinIO has to be reachable on this origin under this
    # certificate: `minio:9000` is a name no browser can resolve, and an
    # http:// URL on an https page is blocked as mixed content before it is
    # even attempted.
    upstream teamup_minio {
        server minio:9000;
        keepalive 16;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name teamup.example.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name teamup.example.com;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Static files (embedded in Go binary, but served via nginx for performance)
        location /static/ {
            proxy_pass http://teamup_backend;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # LiveKit signalling. Media itself does not come through here — that
        # is UDP straight to the server — so the ports LiveKit uses for RTC
        # still have to be reachable.
        location /livekit/ {
            rewrite ^/livekit/(.*) /$1 break;
            proxy_pass http://teamup_livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # Object storage, path-style. The presigned URL is
        # https://<this origin>/<bucket>/<object key>, so this prefix MUST be
        # exactly TEAMUP_MINIO_BUCKET and nothing here may rewrite the path:
        # the S3 signature covers the URI, the query string and the Host
        # header, and MinIO recomputes it from what actually arrives.
        location /teamup-files/ {
            proxy_pass http://teamup_minio;
            proxy_http_version 1.1;

            # $http_host, not $host: the Host header is signed, and $host
            # drops a non-default port. Both alternatives were tried against a
            # real MinIO behind this config — `$host` on an origin with a port
            # gives SignatureDoesNotMatch, and nginx's default ($proxy_host)
            # gives "Invalid Request (invalid hostname)".
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads are the point of this block, and the 50M default above
            # would reject them at the proxy. Keep this in step with
            # TEAMUP_MAX_UPLOAD_BYTES — it is the outer bound, not the real
            # limit, which is signed into each URL.
            client_max_body_size 100m;

            # Stream the body straight through instead of spooling a whole
            # upload to disk first, and do not buffer or compress downloads.
            proxy_request_buffering off;
            proxy_buffering off;
            gzip off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket
        location /ws {
            proxy_pass http://teamup_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # API
        location /api/ {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth
        location /auth/ {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Wizard
        location /wizard/ {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health & Metrics
        location /healthz/ {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
        }

        location /metrics {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # SPA fallback
        location / {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
