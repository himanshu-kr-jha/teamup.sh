# One worker per core, each allowed far more open files than it has
# connections: a proxied request holds two, the client's and the upstream's.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # Every open chat tab and every call holds a WebSocket for as long as it is
    # open, so 1024 was a few hundred people at most.
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Which nginx this is helps nobody but somebody looking for its bugs.
    server_tokens off;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # The same line as the default format, with the path but not the query
    # string. Used where the query carries a credential: LiveKit's access
    # token, the presigned signature on a storage URL, a sign-in callback's
    # one-time code. A log is read by more people, and kept longer, than any
    # of those should live.
    map $request_uri $request_path {
        ~^([^?]*) $1;
        default   $request_uri;
    }
    log_format noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    # Buffer sizes
    #
    # The application refuses an API body over 2 MiB anyway (limitBodies in
    # cmd/teamup/security.go), and avatars and logos are capped at 1 MiB
    # inside that, so anything bigger is turned away here before it is read.
    # Files never come this way; the locations that take large bodies (object
    # storage, code-host webhooks) raise it for themselves.
    client_max_body_size 2m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    # Timeouts
    #
    # Short on the client side, so a connection that trickles its headers or
    # body in a byte at a time cannot hold a worker slot for minutes. The body
    # timeout is between two reads, not for the whole body, so a slow upload
    # that keeps moving is unaffected. A timed-out connection is reset rather
    # than closed politely, which frees its memory at once.
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/wasm;

    # Docker's DNS. `resolve` on the servers below follows it at run time.
    # Without that, nginx looks each name up once at start: it refuses to start
    # if the app is not up yet, and after an upgrade it keeps sending traffic to
    # the old container's address, which is a 502 until somebody restarts it.
    resolver 127.0.0.11 valid=5s;

    # Upstream
    upstream teamup_backend {
        zone teamup_backend 64k;
        server teamup:8080 resolve;
        keepalive 32;
    }

    # Password guessing, coarsely. The application throttles each account
    # itself (cmd/teamup/limits.go); this is the outer bound per address, so
    # one address cannot try passwords against many accounts at full speed.
    # A whole office arrives from one NAT address on a Monday morning, so the
    # burst is one login for each of the 50 people this is sized for. Past
    # that, one attempt every six seconds.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # Everything else under /api/. Sized so that a full office behind one NAT
    # address never meets it: a page load is a few dozen calls, and the burst
    # absorbs fifty people opening the app at once. It is there to stop one
    # address hammering the API, not to shape ordinary use.
    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;

    # Concurrent requests per address. Over HTTP/2 each stream counts, and a
    # WebSocket counts for as long as it is open. The numbers are set for the
    # same office of fifty, each with a tab or two open.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # LiveKit's signalling socket. A page served over HTTPS cannot open a
    # ws:// connection to port 7880, so it is reached through this origin and
    # inherits the site's certificate.
    upstream teamup_livekit {
        zone teamup_livekit 64k;
        server livekit:7880 resolve;
    }

    # Object storage. Uploads and inline images are presigned URLs the BROWSER
    # opens directly, so MinIO has to be reachable on this origin under this
    # certificate: `minio:9000` is a name no browser can resolve, and an
    # http:// URL on an https page is blocked as mixed content before it is
    # even attempted.
    upstream teamup_minio {
        zone teamup_minio 64k;
        server minio:9000 resolve;
        keepalive 16;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla's "intermediate" list: forward secrecy and AEAD only, no CBC.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Resumption from a server-side cache, not tickets: a ticket key lives
        # as long as the process and, if it leaks, decrypts every session it
        # sealed, which undoes forward secrecy. 10m holds about 40,000
        # sessions.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn perip 200;

        # Security headers. The app sets its own (Content-Security-Policy and
        # the rest, cmd/teamup/security.go), so they are tested with it; this
        # is only what belongs to the HTTPS connection. A location with an
        # add_header of its own drops these, so those repeat it.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Static files (embedded in Go binary, but served via nginx for performance)
        location /static/ {
            proxy_pass http://teamup_backend;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # LiveKit signalling. Media itself does not come through here — that
        # is UDP straight to the server — so the ports LiveKit uses for RTC
        # still have to be reachable.
        location /livekit/ {
            # The access token is in the query string.
            access_log /var/log/nginx/access.log noquery;
            limit_conn perip 100;
            rewrite ^/livekit/(.*) /$1 break;
            proxy_pass http://teamup_livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # Object storage, path-style. The presigned URL is
        # https://<this origin>/<bucket>/<object key>, so this prefix MUST be
        # exactly TEAMUP_MINIO_BUCKET and nothing here may rewrite the path:
        # the S3 signature covers the URI, the query string and the Host
        # header, and MinIO recomputes it from what actually arrives.
        location /teamup-files/ {
            # The query string is the signature that grants access.
            access_log /var/log/nginx/access.log noquery;
            proxy_pass http://teamup_minio;
            proxy_http_version 1.1;

            # $http_host, not $host: the Host header is signed, and $host
            # drops a non-default port. Both alternatives were tried against a
            # real MinIO behind this config — `$host` on an origin with a port
            # gives SignatureDoesNotMatch, and nginx's default ($proxy_host)
            # gives "Invalid Request (invalid hostname)".
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads are the point of this block, and the 2m default above
            # would reject them at the proxy. Keep this in step with
            # TEAMUP_MAX_UPLOAD_BYTES — it is the outer bound, not the real
            # limit, which is signed into each URL.
            client_max_body_size 100m;

            # Stream the body straight through instead of spooling a whole
            # upload to disk first, and do not buffer or compress downloads.
            proxy_request_buffering off;
            proxy_buffering off;
            gzip off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Whatever was uploaded, opened here it is a document with no
            # power: no script, no forms, no plugins, as if from another site.
            # The app also chooses the type each file is served as.
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # WebSocket
        location /ws {
            access_log /var/log/nginx/access.log noquery;
            limit_conn perip 100;
            proxy_pass http://teamup_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # API
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The one endpoint that checks a password.
        location = /api/auth/login {
            limit_req zone=login burst=50 nodelay;
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # GitHub and Bitbucket deliveries, which the application reads up to
        # 25 MiB of (internal/integrations/routes.go). A push with a large
        # diff is bigger than an ordinary API call, and is not a person.
        location ~ ^/api/integrations/(github|bitbucket)/hook/ {
            limit_req zone=api burst=200 nodelay;
            client_max_body_size 25m;
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth. A sign-in callback carries its one-time code in the query.
        location /auth/ {
            access_log /var/log/nginx/access.log noquery;
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Wizard
        location /wizard/ {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Operator endpoints stay on the compose network. /metrics has no
        # authentication, and readiness names internal hosts and the version.
        # This used to allow private address ranges, which let the whole
        # internet in: a connection through Docker's userland proxy, or from a
        # load balancer, arrives from a private address.
        location ~ ^/(metrics|readyz|healthz/ready) {
            return 404;
        }

        # Liveness, for an uptime monitor.
        location /healthz {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
        }

        # SPA fallback
        location / {
            proxy_pass http://teamup_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
