version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamup-postgres
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: teamup
      POSTGRES_DB: teamup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup -d teamup"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamup-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: teamup-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  livekit:
    image: livekit/livekit-server:latest
    container_name: teamup-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          # On a server with a public address, let LiveKit discover it. On a
          # local network that discovery finds an address phones on the same
          # network cannot reach, so set TEAMUP_LIVEKIT_NODE_IP to this
          # machine's LAN address and turn discovery off.
          use_external_ip: ${TEAMUP_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${TEAMUP_LIVEKIT_NODE_IP:-}"
        keys:
          "devkey": "devsecret"
        # Egress reports job status back over Redis; without it recordings
        # start but their completion is never observed.
        redis:
          address: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Call recording. LiveKit Egress composites the room and writes the file
  # straight into MinIO, so the media never passes through the application.
  # Without this service, starting a recording reports that it is unavailable.
  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    # Chromium inside the container needs these to render the room.
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: devkey
        api_secret: devsecret
        ws_url: ws://livekit:7880
        insecure: true
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy

  # TeamUp application
  teamup:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      TEAMUP_DATABASE_URL: postgres://teamup:teamup@postgres:5432/teamup?sslmode=disable
      TEAMUP_REDIS_URL: redis://redis:6379
      TEAMUP_MINIO_ENDPOINT: minio:9000
      TEAMUP_MINIO_ACCESS_KEY: minioadmin
      TEAMUP_MINIO_SECRET_KEY: minioadmin
      TEAMUP_MINIO_BUCKET: teamup-files
      TEAMUP_LIVEKIT_URL: http://livekit:7880
      TEAMUP_LIVEKIT_API_KEY: devkey
      TEAMUP_LIVEKIT_API_SECRET: devsecret
      TEAMUP_PORT: "8080"
      TEAMUP_ENV: development
      TEAMUP_LOG_LEVEL: debug
      TEAMUP_BASE_URL: http://localhost:8080
      TEAMUP_AUTO_SETUP: "true"
      TEAMUP_SETUP_ORG_NAME: "Demo Org"
      TEAMUP_SETUP_ORG_SUBDOMAIN: "demo"
      TEAMUP_SETUP_ADMIN_EMAIL: "admin@demo.local"
      TEAMUP_SETUP_ADMIN_PASSWORD: "admin123456"
      TEAMUP_SETUP_OIDC_PROVIDER: "custom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_healthy
    volumes:
      - ./web/dist:/app/web/dist:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
