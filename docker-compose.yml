services:
  postgres:
    image: postgres:16-alpine
    container_name: teamup-postgres
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: teamup
      POSTGRES_DB: teamup
    ports:
      - "${TEAMUP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup -d teamup"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamup-redis
    ports:
      - "${TEAMUP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # The same image as docker-compose.prod.yml, which says why it is not
    # minio/minio. It has no shell, so it has no healthcheck of its own either.
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    container_name: teamup-minio
    command: server /data --console-address ":9001"
    ports:
      - "${TEAMUP_MINIO_PORT:-9000}:9000"
      - "${TEAMUP_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: teamup-livekit
    ports:
      - "${TEAMUP_LIVEKIT_PORT:-7880}:7880"
      - "${TEAMUP_LIVEKIT_TCP_PORT:-7881}:7881"
      - "7882:7882"
    # start.sh runs the app on the host and this file can run it in a container.
    # The host address reaches it either way, through the published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          # On a server with a public address, let LiveKit discover it. On a
          # local network that discovery finds an address phones on the same
          # network cannot reach, so set TEAMUP_LIVEKIT_NODE_IP to this
          # machine's LAN address and turn discovery off.
          use_external_ip: ${TEAMUP_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${TEAMUP_LIVEKIT_NODE_IP:-}"
        keys:
          "devkey": "devsecret"
        # Who was in a call, and when, comes from these.
        webhook:
          api_key: "devkey"
          urls:
            - http://host.docker.internal:${TEAMUP_PORT:-8080}/api/livekit/webhook
        # Egress reports job status back over Redis; without it recordings
        # start but their completion is never observed.
        redis:
          address: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Call recording. LiveKit Egress composites the room and writes the file
  # straight into MinIO, so the media never passes through the application.
  # Without this service, starting a recording reports that it is unavailable.
  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    # Chromium inside the container needs these to render the room.
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: devkey
        api_secret: devsecret
        ws_url: ws://livekit:7880
        insecure: true
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_started

  # TeamUp application
  teamup:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${TEAMUP_PORT:-8080}:8080"
    environment:
      TEAMUP_DATABASE_URL: postgres://teamup:teamup@postgres:5432/teamup?sslmode=disable
      TEAMUP_REDIS_URL: redis://redis:6379
      TEAMUP_MINIO_ENDPOINT: minio:9000
      TEAMUP_MINIO_ACCESS_KEY: minioadmin
      TEAMUP_MINIO_SECRET_KEY: minioadmin
      TEAMUP_MINIO_BUCKET: teamup-files
      TEAMUP_LIVEKIT_URL: http://livekit:7880
      TEAMUP_LIVEKIT_API_KEY: devkey
      TEAMUP_LIVEKIT_API_SECRET: devsecret
      # Explicit, because pgx's own default is max(4, NumCPU) and a container
      # with a CPU limit gets four connections for the whole application.
      TEAMUP_DB_MAX_CONNS: "25"
      TEAMUP_MAX_CALL_PARTICIPANTS: "200"
      TEAMUP_PORT: "8080"
      TEAMUP_ENV: development
      TEAMUP_LOG_LEVEL: debug
      TEAMUP_BASE_URL: http://localhost:8080
      TEAMUP_AUTO_SETUP: "true"
      TEAMUP_SETUP_ORG_NAME: "Demo Org"
      TEAMUP_SETUP_ORG_SUBDOMAIN: "demo"
      TEAMUP_SETUP_ADMIN_EMAIL: "admin@demo.local"
      TEAMUP_SETUP_ADMIN_PASSWORD: "admin123456789"
      TEAMUP_SETUP_OIDC_PROVIDER: "custom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      livekit:
        condition: service_healthy
    volumes:
      - ./web/dist:/app/web/dist:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
