name: Release

# Publishing is gated on a semver tag and nothing else. Pushing to a branch
# never reaches GHCR and never creates a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'
  REGISTRY: ghcr.io

jobs:
  # ── Binaries ────────────────────────────────────────────────────────────
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    # The OIDC token and the attestations scope exist only to sign the
    # provenance of the binaries below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No caches anywhere in this workflow. Any branch's CI run can write to
      # the Actions cache, so a release restored from it would ship whatever
      # that run left there. A release is built from the lockfiles alone.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # cmd/teamup/main.go embeds web/dist, so the SPA has to exist before any
      # Go build can succeed.
      - name: Build SPA
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build multi-arch binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          commit=$(git rev-parse --short HEAD)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-s -w -X main.version=$VERSION -X main.commit=$commit -X main.date=$built" \
              -o "dist/teamup-linux-$arch" ./cmd/teamup
          done

      - name: Smoke test the native binary
        run: ./dist/teamup-linux-amd64 version

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum teamup-linux-* > checksums.txt
          cat checksums.txt

      # Signed, verifiable record of which workflow, commit and runner built
      # each binary: `gh attestation verify teamup-linux-amd64 -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/teamup-linux-*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  # ── Image ───────────────────────────────────────────────────────────────
  docker:
    name: Push image to GHCR
    needs: build-release
    runs-on: ubuntu-latest
    # id-token and attestations sign the image's provenance; packages pushes
    # the image and the attestation beside it.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` would be wrong on a release candidate. The version comes in
      # through the environment, never spliced into the script, so nothing in
      # it can be run as shell.
      - name: Decide whether this is a prerelease
        id: channel
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.prerelease == 'false' }}

      # SBOM and max-mode provenance go into the pushed image index, so anyone
      # pulling it can see what is inside and how it was built.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-release.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          no-cache: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Chart ───────────────────────────────────────────────────────────────
  helm:
    name: Package Helm chart
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Stamp the chart with the release version
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" helm/teamup/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/teamup/Chart.yaml
          sed -i "s|^  tag: .*|  tag: \"$VERSION\"|" helm/teamup/values.yaml

      - name: helm lint
        run: helm lint helm/teamup

      - name: helm package
        run: helm package helm/teamup -d dist/helm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart
          path: dist/helm/
          retention-days: 30

  # ── Release ─────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build-release, docker, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: helm-chart
          path: dist/helm

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: TeamUp ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/teamup-linux-amd64
            dist/teamup-linux-arm64
            dist/checksums.txt
            dist/helm/teamup-${{ needs.build-release.outputs.version }}.tgz
