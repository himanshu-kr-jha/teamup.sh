name: CI

# Nothing here publishes. Every job is a check; pushing images, packaging the
# chart and cutting releases live in release.yml and only run on a semver tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────
  # Runs first because everything else needs its output: cmd/teamup/main.go
  # has `//go:embed all:web/dist`, so `go build ./...`, `go vet ./...` and
  # `go test ./cmd/...` all fail with "pattern all:web/dist: no matching files
  # found" until the SPA has been built. The directory is gitignored, so a
  # fresh checkout never has it.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Only what ships to the browser. A dev-only tool with an advisory
      # cannot reach a user, and failing on those would make the check noise.
      # web/package.json accepts two React Router 6 advisories by id: the
      # open redirect needs a backslash path, which nextPath.ts and links.ts
      # refuse, and the other is in server rendering, which TeamUp does not
      # use. Version 7 fixes both and is its own change: it broke calls.
      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level moderate

      - name: ESLint
        working-directory: web
        run: pnpm lint

      # `pnpm test` is bare `vitest`, which watches and never exits. `run` is
      # the one-shot form.
      - name: Vitest
        working-directory: web
        run: pnpm exec vitest run

      # `pnpm build` is `tsc && vite build`, so this is also the typecheck.
      # Vite writes to ../cmd/teamup/web/dist (see web/vite.config.ts).
      - name: Build SPA
        working-directory: web
        run: pnpm build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: cmd/teamup/web/dist
          if-no-files-found: error
          retention-days: 1

  # ── Go lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (Go)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: cmd/teamup/web/dist

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint reports 26 pre-existing findings across packages this
      # ticket does not touch (20 errcheck, 4 staticcheck, 1 ineffassign,
      # 1 unused — see issue 43). Blocking on them would make every PR red for
      # debt it did not create, and silencing them would make the linter
      # useless. So it blocks on issues the pull request introduces and
      # ignores the rest. Once the backlog is cleared, drop only-new-issues
      # and let this run on push as well.
      - name: golangci-lint (new issues only)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          only-new-issues: true

  # ── Go vulnerabilities ──────────────────────────────────────────────────
  # Reports only vulnerabilities in code the binary can actually reach, so a
  # finding here is one to fix, not to triage. The version is pinned so a new
  # release of the tool cannot change what passes without a commit.
  govulncheck:
    name: Vulnerabilities (Go)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The embedded SPA has to exist for ./cmd/teamup to type-check.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: cmd/teamup/web/dist

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # ── Go tests ────────────────────────────────────────────────────────────
  test:
    name: Test (Go)
    needs: frontend
    runs-on: ubuntu-latest

    services:
      # internal/testsupport clones this database once per test package, so
      # the connecting role has to be allowed to CREATE DATABASE. The
      # container's POSTGRES_USER is a superuser, which covers it.
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: teamup
          POSTGRES_PASSWORD: teamup
          POSTGRES_DB: teamup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # internal/presence reads TEAMUP_TEST_REDIS_URL and SKIPS when it cannot
      # connect — and the skip guard below turns a skip into a failed build, so
      # this is not optional dead weight.
      redis:
        image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEAMUP_TEST_DATABASE_URL: postgres://teamup:teamup@localhost:5432/teamup_test?sslmode=disable
      TEAMUP_TEST_REDIS_URL: redis://localhost:6379
      # internal/files' object-storage integration tests skip unless this is
      # set, and the skip guard below turns a skip into a failed build. They
      # are the only tests that exercise presigned multipart against a real S3
      # implementation, which is where the signing rules actually live.
      TEAMUP_TEST_MINIO_ENDPOINT: localhost:9000
      TEAMUP_TEST_MINIO_ACCESS_KEY: minioadmin
      TEAMUP_TEST_MINIO_SECRET_KEY: minioadmin
      TEAMUP_TEST_MINIO_BUCKET: teamup-files-test
      # internal/calls closes a real room on the LiveKit started below, and
      # skips without this, which the skip guard turns into a failed build.
      # --dev serves the key "devkey" with the secret "secret".
      TEAMUP_TEST_LIVEKIT_URL: ws://localhost:7880
      TEAMUP_TEST_LIVEKIT_SECRET: secret
      # 487 top-level tests pass locally as of the threading/multipart wave.
      # The floor sits below that on purpose — it exists to catch a suite that
      # has silently lost most of itself, not to be updated on every commit.
      MIN_EXPECTED_TESTS: '480'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: cmd/teamup/web/dist

      # Not `make test-db`: that target drops a hardcoded `teamup_test`
      # regardless of the URL it is given. Migrating the service container's
      # database directly does the same job without that trap.
      #
      # `teamup migrate` parses the whole config and rejects a missing Redis,
      # MinIO or LiveKit setting even though migrating touches none of them
      # (issue 46). The placeholders below exist only to get past that check;
      # nothing connects to them.
      - name: Migrate the template database
        env:
          TEAMUP_DATABASE_URL: postgres://teamup:teamup@localhost:5432/teamup_test?sslmode=disable
          TEAMUP_REDIS_URL: redis://127.0.0.1:6379
          TEAMUP_MINIO_ENDPOINT: 127.0.0.1:9000
          TEAMUP_MINIO_ACCESS_KEY: unused-by-migrate
          TEAMUP_MINIO_SECRET_KEY: unused-by-migrate
          TEAMUP_MINIO_BUCKET: unused-by-migrate
          TEAMUP_LIVEKIT_URL: http://127.0.0.1:7880
          TEAMUP_LIVEKIT_API_KEY: unused-by-migrate
          TEAMUP_LIVEKIT_API_SECRET: unused-by-migrate
        run: go run ./cmd/teamup migrate up

      # A Go toolchain fetched as a module (GOTOOLCHAIN=auto) ships a trimmed
      # pkg/tool without covdata, and `go test -coverprofile` then fails with
      # `go: no such tool "covdata"` for every package that has no test files.
      # actions/setup-go installs the full distribution, which has it — but if
      # that ever changes, coverage is dropped with a warning instead of
      # failing the build for a reason nobody would guess from the message.
      - name: Check the toolchain ships covdata
        id: covdata
        run: |
          if go tool covdata help >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::this Go toolchain has no covdata tool; running without a coverage profile"
          fi

      # ./cmd/... is included deliberately (issue 45): it holds the config
      # loading and LiveKit proxy tests, and `make test-unit` leaves it out.
      # -race is what catches the unlocked-map class of bug in the hub.
      #
      # -tags=integration rather than a second `make test-integration` step:
      # a build tag only adds files, so `go test -tags=integration ./internal/...`
      # re-runs every ordinary test as well. No file carries that tag today, so
      # a separate step would double a three-minute suite for nothing; folding
      # the tag in here runs everything exactly once and still picks up the
      # first integration test somebody writes.
      # cmd/teamup's readiness and shutdown tests boot a real server, which
      # refuses to start unless every dependency answers. They address the
      # standard ports directly, so these run on the host network rather than
      # as `services:` entries — a service container cannot override the
      # image's command, and both of these need one.
      - name: Start MinIO and LiveKit
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b server /data
          docker run -d --name livekit -p 7880:7880 \
            livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20 --dev --bind 0.0.0.0

          # The bucket is not created by anything on the boot path, so a
          # readiness probe that checks for it fails against an empty MinIO.
          for i in $(seq 1 30); do
            docker run --rm --network host \
              -e MC_HOST_ci=http://minioadmin:minioadmin@127.0.0.1:9000 \
              cgr.dev/chainguard/minio-client@sha256:8dc1dceb7371c9091b17b450e4da67a492f6de3a22d716af14888a7d8597457e \
              mb --ignore-existing ci/teamup-files && break
            sleep 2
          done

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:7880/ && break
            sleep 2
          done
          echo "minio: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/minio/health/live)"
          echo "livekit: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7880/)"

      - name: Run the suite
        run: |
          set -o pipefail
          cover=()
          if [ "${{ steps.covdata.outputs.available }}" = "true" ]; then
            cover=(-coverprofile=coverage.out -covermode=atomic)
          fi
          go test -race -v -tags=integration "${cover[@]}" \
            ./internal/... ./pkg/... ./cmd/... 2>&1 | tee test.log

      # The trap this repository already fell into once: internal/testsupport
      # skips every database-backed test when TEAMUP_TEST_DATABASE_URL is
      # unset, so a workflow that loses its Postgres service still exits 0
      # while testing almost nothing. A skip in CI is a failure.
      - name: Refuse a run in which any test skipped
        if: always()
        run: |
          if grep -Eq '^[[:space:]]*--- SKIP' test.log; then
            echo "::error::tests were skipped — CI must run the database-backed suite, not step over it"
            grep -E '^[[:space:]]*--- SKIP' test.log
            exit 1
          fi
          echo "no skipped tests"

      # Second half of the same guard: a suite that compiles but has lost most
      # of its tests also exits 0. Raise the floor as the suite grows.
      - name: Refuse a run that lost tests
        if: always()
        run: |
          passed=$(grep -Ec '^--- PASS' test.log || true)
          echo "$passed top-level tests passed (floor: $MIN_EXPECTED_TESTS)"
          if [ "$passed" -lt "$MIN_EXPECTED_TESTS" ]; then
            echo "::error::only $passed tests ran, expected at least $MIN_EXPECTED_TESTS"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: go-test-log
          path: test.log
          retention-days: 7

  # ── Multi-arch binaries ─────────────────────────────────────────────────
  build:
    name: Build (linux/${{ matrix.arch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: cmd/teamup/web/dist

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w \
              -X main.version=$(git describe --tags --always --dirty) \
              -X main.commit=$(git rev-parse --short HEAD) \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o teamup-linux-${{ matrix.arch }} ./cmd/teamup

      # Only the runner's own architecture can be executed here.
      - name: Smoke test the binary
        if: matrix.arch == 'amd64'
        run: |
          ./teamup-linux-amd64 version
          ./teamup-linux-amd64 migrate --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teamup-linux-${{ matrix.arch }}
          path: teamup-linux-${{ matrix.arch }}
          retention-days: 7

  # ── Docker image ────────────────────────────────────────────────────────
  # Builds both architectures to prove the Dockerfile still works. It never
  # pushes: publishing happens on a tag, in release.yml.
  docker:
    name: Docker image (build only)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm chart ──────────────────────────────────────────────────────────
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint helm/teamup

  # ── Browser tests ───────────────────────────────────────────────────────
  # Every Playwright spec against the real stack, exactly as `make e2e` runs
  # them locally: Postgres, Redis, MinIO, LiveKit and Mailpit in throwaway
  # containers (scripts/test-services.sh), then the real binary, rebuilt with
  # the test ports, driven by Chromium. Self-contained, so it starts at once
  # rather than after the frontend job. About 20 minutes; one at a time per
  # branch, a newer push cancelling the run it replaces.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the test services
        run: scripts/test-services.sh up

      - name: Run the browser tests
        run: make e2e

      - name: Keep what a failure left behind
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
