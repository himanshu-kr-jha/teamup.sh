<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the app reach the phone's edges, and the layout
         keeps clear of the notch and the home bar with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TeamUp - chat, calls, meetings and tasks for your team" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Added to an iPhone's home screen, it opens as an app of its own. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeamUp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TeamUp</title>
    <script>
      // Here and not in the bundle, so a dark page never paints white first. The
      // rule is isDarkTheme in src/shared/theme.ts, which is tested against this.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', saved === 'dark' || (saved !== 'light' && systemDark));
        // The organization's colour, as setTokens in src/shared/branding.ts puts it.
        try {
          var brand = JSON.parse(localStorage.getItem('branding-tokens') || 'null');
          if (brand && brand.primary) {
            var style = document.documentElement.style;
            style.setProperty('--primary', brand.primary);
            style.setProperty('--ring', brand.primary);
            style.setProperty('--primary-foreground', brand.primaryForeground);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* What shows while the app's code downloads, drawn the way LoadingScreen
         draws it once React is running, so the first screen does not jump. The
         colours are the theme's, with its values as fallbacks for before the
         stylesheet has loaded; the organization's colour comes from the script
         above. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: hsl(var(--background, 0 0% 100%));
        color: hsl(var(--foreground, 222.2 84% 4.9%));
        font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
      }
      html.dark .boot {
        background: hsl(var(--background, 222.2 84% 4.9%));
        color: hsl(var(--foreground, 210 40% 98%));
      }
      .boot-mark {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
      }
      .boot-mark svg {
        width: 40px;
        height: 40px;
        color: hsl(var(--primary, 239 84% 67%));
      }
      .boot-bar {
        position: relative;
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: hsl(var(--primary, 239 84% 67%) / 0.15);
      }
      .boot-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 9999px;
        background: hsl(var(--primary, 239 84% 67%));
        animation: boot-bar 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading TeamUp">
        <div class="boot-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="9" y2="9" /><line x1="4" x2="20" y1="15" y2="15" /><line x1="10" x2="8" y1="3" y2="21" /><line x1="16" x2="14" y1="3" y2="21" />
          </svg>
          <span>TeamUp</span>
        </div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
