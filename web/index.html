<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeamUp - Self-hosted collaboration platform" />
    <meta name="theme-color" content="#4f46e5" />
    <title>TeamUp</title>
    <script>
      // Here and not in the bundle, so a dark page never paints white first. The
      // rule is isDarkTheme in src/shared/theme.ts, which is tested against this.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', saved === 'dark' || (saved !== 'light' && systemDark));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
