# .git/hooks/pre-commit runs `pre-commit run --all-files`, which failed on every
# commit because this file did not exist. These are the same checks CI runs
# (see .scratch/teamup-platform/issues/08-cicd-github-actions.md), kept to the
# fast ones — the database-backed tests need TEAMUP_TEST_DATABASE_URL and are
# skipped without it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^web/pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^(web/pnpm-lock\.yaml|go\.sum)$
      - id: check-yaml
        exclude: ^helm/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: bash -c 'unformatted=$(gofmt -l ./cmd ./internal ./pkg); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi'
        language: system
        pass_filenames: false
        files: \.go$

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        pass_filenames: false
        files: \.go$

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: \.go$

      - id: go-test
        name: go test
        entry: go test -p 1 ./...
        language: system
        pass_filenames: false
        files: \.go$

      - id: web-typecheck
        name: tsc --noEmit
        entry: bash -c 'cd web && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx)$

      - id: web-lint
        name: eslint
        entry: bash -c 'cd web && npm run lint'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx)$
