# The stack for one VM. docs/DEPLOYMENT.md walks through using it.
#
# Everything is configured from .env beside this file. Compose stops with a
# message naming any required setting that is missing.
#
# Only nginx (80, 443) and LiveKit's media ports are published. Docker writes
# its own iptables rules, so a published port is reachable from the internet
# even when ufw says it is closed. Postgres, Redis, MinIO and the app itself
# have no authentication worth exposing, and they talk over the compose network.
#
# Image versions are pinned so that a rebuilt VM runs what was tested. Bump them
# deliberately; see "Upgrades" in docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: teamup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose. On first start the image runs a temporary server on
      # the Unix socket alone, and a socket check calls that healthy just before
      # it shuts down, so whatever was waiting then fails to connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teamup -d teamup"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  minio:
    # Not minio/minio: MinIO archived the open-source project and removed its
    # images from Docker Hub, Quay and dl.min.io, so that name cannot be pulled
    # on a new machine. Chainguard still builds it. It publishes only `latest`
    # for free, so this is pinned by digest. The image has no shell, so it has
    # no healthcheck of its own; the app's readiness probe covers object storage.
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      # One UDP port for all media, not a range. Publishing LiveKit's usual
      # 50000-60000 through Docker starts one docker-proxy process per port.
      # Measured on 12 cores: about 2 MB each, under 10 per second, and after 5
      # minutes under 3000 of the 10001 had started while the machine ran out
      # of memory. The container cannot even be removed until that finishes.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}": "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
        # Who was in a call, and when, comes from these. They go straight to the
        # app over the compose network, signed with this key.
        webhook:
          api_key: "${LIVEKIT_API_KEY}"
          urls:
            - http://teamup:8080/api/livekit/webhook
        redis:
          address: "redis:6379"
          password: "${REDIS_PASSWORD}"
    # 7880, the API and signalling port, is reached only through nginx.
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # Applies pending migrations and exits. The server does not migrate on its
  # own, and on an empty database it exits at once, so it waits for this.
  # This is what makes `docker compose up -d` the whole upgrade.
  migrate:
    image: ${TEAMUP_IMAGE:-teamup:local}
    restart: "no"
    command: ["migrate", "up"]
    environment:
      TEAMUP_DATABASE_URL: postgres://teamup:${POSTGRES_PASSWORD}@postgres:5432/teamup?sslmode=disable
      TEAMUP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  teamup:
    # No registry image is published yet, so `docker compose build` makes this
    # one from the checkout. Set TEAMUP_IMAGE to a tag per release; keeping the
    # previous tag is what makes rollback possible.
    image: ${TEAMUP_IMAGE:-teamup:local}
    build:
      context: .
      args:
        VERSION: ${TEAMUP_VERSION:-dev}
    restart: unless-stopped
    environment:
      TEAMUP_DATABASE_URL: postgres://teamup:${POSTGRES_PASSWORD}@postgres:5432/teamup?sslmode=disable
      TEAMUP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Presigned URLs are opened by the BROWSER, so this is the public origin,
      # not a compose hostname, and it has to be TLS or an https page blocks
      # the request as mixed content. nginx proxies https://<origin>/<bucket>/
      # straight through to MinIO; the bucket below must match that location
      # block, because the S3 signature covers the path.
      TEAMUP_MINIO_ENDPOINT: ${TEAMUP_DOMAIN:?set TEAMUP_DOMAIN in .env}
      TEAMUP_MINIO_SECURE: "true"
      # ...while this process reaches the same storage directly for the calls
      # it makes itself (readiness, stat, delete), which stays on the compose
      # network and never touches the proxy or TLS.
      TEAMUP_MINIO_INTERNAL_ENDPOINT: minio:9000
      TEAMUP_MINIO_INTERNAL_SECURE: "false"
      TEAMUP_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      TEAMUP_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      TEAMUP_MINIO_BUCKET: teamup-files
      # Part of the signing key, so it must match the object store. MinIO's own
      # default is us-east-1; if you set MINIO_REGION on the minio service, set
      # the same value here or every signature is wrong. A mismatch is caught
      # by the readiness probe at start-up, not by a user's failed upload.
      TEAMUP_MINIO_REGION: us-east-1
      # Largest single upload, in bytes (100 MiB). Signed into each upload URL,
      # so object storage refuses anything else; keep nginx's
      # client_max_body_size on the /teamup-files/ location at least this big.
      # 5 GiB. Real multipart means no single request is ever larger than one
      # part, so raising this does not require touching nginx.
      TEAMUP_MAX_UPLOAD_BYTES: "5368709120"
      TEAMUP_MULTIPART_THRESHOLD_BYTES: "16777216"
      TEAMUP_LIVEKIT_URL: http://livekit:7880
      TEAMUP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      TEAMUP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Explicit, because pgx's own default is max(4, NumCPU) and a container
      # with a CPU limit gets four connections for the whole application. Four
      # of these still fit inside PostgreSQL's default max_connections of 100.
      TEAMUP_DB_MAX_CONNS: "25"
      TEAMUP_MAX_CALL_PARTICIPANTS: "200"
      TEAMUP_PORT: "8080"
      TEAMUP_ENV: production
      TEAMUP_LOG_LEVEL: info
      TEAMUP_BASE_URL: https://${TEAMUP_DOMAIN}
      # Encrypts the token-signing key where it is stored, so a database
      # backup does not carry the ability to mint access tokens. Keep it: the
      # stored key cannot be read back without the value it was sealed with.
      TEAMUP_AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Google Calendar sync. Optional: left empty, nobody is offered it.
      # scripts/setup-google-calendar.sh sets all three. The token key seals
      # each person's Google token; changing it means everybody connects again.
      TEAMUP_GCAL_CLIENT_ID: ${GCAL_CLIENT_ID:-}
      TEAMUP_GCAL_CLIENT_SECRET: ${GCAL_CLIENT_SECRET:-}
      TEAMUP_GCAL_TOKEN_KEY: ${GCAL_TOKEN_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      livekit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # The image is distroless, so there is no wget. The binary probes itself.
      # Reports unhealthy until the wizard finishes, because the wizard is what
      # creates the storage bucket.
      test: ["CMD", "/teamup", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse proxy (nginx)
  nginx:
    image: nginx:1.31.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      default:
        # The public hostname resolves to nginx from inside the network too.
        # LiveKit's Egress uploads recordings to whatever TEAMUP_MINIO_ENDPOINT
        # says, and that is now the public origin; without this alias a
        # container would have to leave the host and come back in through NAT
        # to reach it. It needs a certificate the containers trust: with a
        # self-signed one, recording upload fails while browser uploads, which
        # go through the app's own presigned URLs, still work.
        aliases:
          - ${TEAMUP_DOMAIN}
    depends_on:
      - teamup
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres-data:
  redis-data:
  minio-data:
