{{- if not .Values.secrets.existingSecret }}
{{- $data := include "teamup.secretData" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teamup.secretName" . }}
  labels:
    {{- include "teamup.labels" . | nindent 4 }}
type: Opaque
{{- if trim $data }}
data:
  {{- $data | nindent 2 }}
{{- else }}
# No credentials were supplied. The Secret is created empty so that envFrom
# still resolves; the server will refuse to start and name what it is missing.
data: {}
{{- end }}
{{- end }}
