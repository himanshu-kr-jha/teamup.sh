{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teamup.serviceAccountName" . }}
  labels:
    {{- include "teamup.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# TeamUp never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
