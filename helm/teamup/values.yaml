# Default values for the TeamUp chart.
#
# This chart deploys the TeamUp server and nothing else. PostgreSQL, Redis,
# MinIO (or any S3-compatible store) and LiveKit are prerequisites you point it
# at — see the "Prerequisites" note at the bottom of this file for why they are
# not subcharts.
#
# Every key here is read by a template. If you add one, wire it up.

# One. Not a default to raise.
#
# TeamUp's WebSocket hub keeps its state in three in-process Go maps — who is
# connected, which channels each connection is subscribed to, and who is in
# which call. There is no Redis pub/sub and no other channel between replicas,
# so two of them share nothing: a message sent by somebody on one replica never
# reaches anybody on another. Nothing reports it. The send succeeds, the fan-out
# finds nobody, and the half of the company that did not receive the message has
# no way to know one was sent. Presence splits the same way.
#
# The chart refuses to render more than one — see `allowMultipleReplicas`.
#
# The ceiling this buys: one process serves a few hundred concurrent WebSocket
# sessions comfortably, which is well past the size this product is built for.
# Availability comes from a fast restart (the readiness gate and the 30s drain
# below), not from running two.
replicaCount: 1

# Lets the chart render more than one replica anyway.
#
# Only set this if the deployment genuinely does not use chat, presence or
# calls — a read-only or API-only use. For anything else it buys an outage that
# looks exactly like working software.
allowMultipleReplicas: false

image:
  repository: ghcr.io/himanshu-kr-jha/teamup.sh
  pullPolicy: IfNotPresent
  # Empty follows the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The published image is gcr.io/distroless/static-debian12:nonroot, which runs
# as uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # TeamUp holds a WebSocket open for the lifetime of a session. The default
    # 60s proxy read timeout tears those down once a minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: teamup.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: teamup-tls
  #     hosts:
  #       - teamup.example.com

# The one process serves everybody (see `replicaCount`), so this is the whole
# application's budget. Raise it rather than adding replicas.
#
# The server reads its cgroup CPU quota at boot and sets GOMAXPROCS to match, so
# a `limits.cpu` of 1000m means one scheduling thread rather than one per core
# of whatever node it lands on. Without that a 64-core node gave a one-CPU pod
# sixty-four runnable threads sharing a quota that admits one.
#
# `limits.cpu` below 1000m rounds up to one thread — the runtime cannot schedule
# on a fraction — so a pod throttled to 500m still works, it just waits.
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Probe paths are fixed by the server: /healthz is unconditional liveness,
# /readyz checks its backing services. /readyz applies a 2s internal timeout,
# so a readiness timeoutSeconds below that never sees the negative answer.
#
# /readyz checks PostgreSQL, Redis, object storage and — when TEAMUP_LIVEKIT_URL
# names an HTTP endpoint — LiveKit. A pod that cannot reach any of them stays
# out of the Service until it can, rather than answering 500 to uploads and
# calls behind a rollout that looks green.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# The server drains with a 30s deadline on SIGTERM.
terminationGracePeriodSeconds: 40

# Horizontal autoscaling, which for this application means adding replicas that
# cannot talk to each other. Read the note on `replicaCount` first: with
# maxReplicas above 1 the chart refuses to render unless
# `allowMultipleReplicas` is set.
#
# Vertical headroom is the useful lever here — see `resources` below.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# `teamup migrate up`, run as a pre-install/pre-upgrade hook. The schema has to
# exist before the first server pod starts.
migrations:
  enabled: true
  backoffLimit: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Non-secret TEAMUP_* variables. These are rendered into a ConfigMap.
config:
  env: production
  logLevel: info
  port: 8080
  # Used to build OIDC redirect URLs and links in outbound mail. Must match the
  # address users actually reach, scheme included.
  baseURL: "https://teamup.example.com"
  # Extra origins allowed to open a WebSocket. Same-origin always works.
  allowedWSOrigins: []
  # Drops the Secure flag from auth cookies. Plain-HTTP LAN access only —
  # never on anything reachable from the internet.
  insecureCookies: false

  auth:
    issuer: teamup
    audience: teamup-api

  minio:
    # host:port of the S3-compatible endpoint, no scheme.
    endpoint: minio:9000
    bucket: teamup-files
    # Set true when the endpoint terminates TLS.
    secure: false

  livekit:
    url: http://livekit:7880

  # How many PostgreSQL connections this server holds. The default in the
  # binary is 25, chosen so one replica covers a 60-person organization's
  # traffic plus the push fan-out and still leaves room inside PostgreSQL's
  # default max_connections of 100 for migrations and a psql session.
  dbMaxConns: 25

  # How many people one call may hold: the size of the LiveKit room, and one
  # more than the number of channel members a channel call rings. Not a media
  # limit — LiveKit seats hundreds — but a bound on fan-out, since every invite
  # is a row and a frame. 200 clears an all-hands at this size several times
  # over.
  maxCallParticipants: 200

  # Optional. Without SMTP, invited members are never sent their password.
  smtp:
    host: ""
    port: 587
    user: ""
    from: ""

  # Optional. Web Push is inert without a VAPID keypair; the private half goes
  # in `secrets.vapidPrivateKey`.
  vapid:
    subject: "mailto:admin@teamup.local"

  # Optional OIDC providers. Client secrets live under `secrets`.
  oidc:
    googleClientID: ""
    entraClientID: ""
    entraTenantID: ""
    customIssuer: ""
    customClientID: ""

# Credential-bearing TEAMUP_* variables.
#
# Set `existingSecret` to the name of a Secret you manage yourself (via
# External Secrets, Sealed Secrets, or by hand) whose keys are the TEAMUP_*
# variable names verbatim. When it is set, nothing below is rendered and the
# chart creates no Secret.
#
# Otherwise the values below are written into a chart-managed Secret. They are
# empty by default and this chart ships no defaults for them: a credential
# committed to a values file is a credential everyone has.
#
# Anything left empty is omitted from the Secret rather than written as "".
# The server's `required` check is satisfied by an empty variable, so an empty
# string would hide the startup error instead of producing it.
secrets:
  existingSecret: ""

  # Required. Full DSNs, credentials included.
  #   postgres://teamup:PASSWORD@postgres:5432/teamup?sslmode=require
  #   redis://:PASSWORD@redis-master:6379/0
  databaseURL: ""
  redisURL: ""

  # Required.
  minioAccessKey: ""
  minioSecretKey: ""
  livekitAPIKey: ""
  livekitAPISecret: ""

  # Strongly recommended, and effectively required from the release that
  # persists the JWT signing key: TEAMUP_AUTH_SECRET is the key that wraps it
  # in the database. Lose or change this value and every existing session and
  # refresh token stops verifying — everyone is logged out.
  #
  # Generate one with: openssl rand -base64 48
  authSecret: ""

  # Optional.
  vapidPublicKey: ""
  vapidPrivateKey: ""
  smtpPassword: ""
  googleClientSecret: ""
  entraClientSecret: ""
  customClientSecret: ""

monitoring:
  serviceMonitor:
    # Requires the Prometheus Operator's CRDs in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# ── Prerequisites ────────────────────────────────────────────────────────────
#
# PostgreSQL, Redis, MinIO and LiveKit are NOT subcharts of this chart. Bring
# your own and point the values above at them. The reasoning:
#
#   * The server takes DSNs and endpoints, so a managed RDS/ElastiCache/S3 is a
#     one-line change — while a bundled database would be the one thing in the
#     release nobody can safely `helm uninstall`.
#   * LiveKit needs a wide UDP port range and a routable external address to
#     carry media. A generic subchart gets that wrong more often than right,
#     and the failure mode is calls that connect and then carry no audio.
#   * Vendoring four subcharts makes `helm template`, `helm lint` and CI
#     depend on upstream chart repositories staying reachable and stable.
#
# What must exist before installing:
#
#   * PostgreSQL 16+, reachable, with the database and role in `databaseURL`
#     already created. The chart's migration hook creates the schema.
#   * Redis 7+, reachable at `redisURL`.
#   * An S3-compatible endpoint at `config.minio.endpoint` with the bucket
#     `config.minio.bucket` already created — the server does not create it at
#     boot (only the setup wizard does).
#   * LiveKit reachable at `config.livekit.url`, configured with the same
#     api key/secret pair given in `secrets`.
